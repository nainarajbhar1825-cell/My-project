<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlogHub Module 4</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f6fb;color:#171927}header{background:#11131f;color:white;padding:18px}.w{max-width:1000px;width:92%;margin:auto}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:800}.brand i{color:#9d95ff;font-style:normal}.btn{border:0;border-radius:10px;padding:11px 16px;background:#635bff;color:#fff;font-weight:bold;cursor:pointer}.light{background:#fff;color:#222;border:1px solid #ddd}.hero{margin:25px 0;padding:35px;border-radius:24px;background:linear-gradient(135deg,#11131f,#332e52);color:#fff}.hero h1{font-size:44px;margin:10px 0}.panel,.card{background:#fff;border:1px solid #e3e4eb;border-radius:18px;padding:20px;margin:18px 0}input,textarea,select{width:100%;padding:13px;margin:5px 0 12px;border:1px solid #ddd;border-radius:10px}textarea{min-height:120px}.search{display:flex;gap:10px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{margin:0;min-height:230px;display:flex;flex-direction:column}.tag{font-size:11px;color:#635bff;background:#eeedff;padding:6px 9px;border-radius:20px;width:max-content}.card p{color:#626777;line-height:1.5;flex:1}.actions{display:flex;gap:8px}.danger{background:#e74c5c}.hide{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.search{display:block}.hero h1{font-size:35px}}</style><header><div class="w nav"><div class="brand">Blog<i>Hub</i> • CRUD</div><button class="btn" onclick="openForm()">+ New Blog</button></div></header><main class="w"><section class="hero"><small>MODULE 04 • CRUD OPERATIONS</small><h1>Create. Read. Update. Delete.</h1><p>Complete blog CRUD with search and category filters.</p></section><section id="formBox" class="panel hide"><h2 id="ft">Create Blog</h2><form id="form"><input id="title" placeholder="Blog title" required><select id="cat"><option>Technology</option><option>Education</option><option>Travel</option><option>Lifestyle</option></select><textarea id="body" placeholder="Write your blog..." required></textarea><button class="btn">Save Blog</button> <button type="button" class="btn light" onclick="closeForm()">Cancel</button></form></section><section class="panel"><div class="search"><input id="q" placeholder="🔎 Search blogs" oninput="render()"><select id="f" onchange="render()"><option value="">All categories</option><option>Technology</option><option>Education</option><option>Travel</option><option>Lifestyle</option></select></div></section><section id="grid" class="grid"></section></main><script>let a=JSON.parse(localStorage.m4||"[]"),edit=null,$=x=>document.getElementById(x);function save(){localStorage.m4=JSON.stringify(a)}function openForm(id){edit=id||null;$("formBox").classList.remove("hide");let p=a.find(x=>x.id===edit);$("ft").textContent=edit?"Update Blog":"Create Blog";$("title").value=p?.title||"";$("cat").value=p?.cat||"Technology";$("body").value=p?.body||""}function closeForm(){$("formBox").classList.add("hide");edit=null;$("form").reset()}$("form").onsubmit=e=>{e.preventDefault();let d={title:$("title").value,cat:$("cat").value,body:$("body").value};if(edit)Object.assign(a.find(x=>x.id===edit),d);else a.push({id:Date.now(),...d,date:Date.now()});save();closeForm();render()};function del(id){if(confirm("Delete this blog?")){a=a.filter(x=>x.id!==id);save();render()}}function render(){let q=$("q").value.toLowerCase(),f=$("f").value,x=a.filter(p=>(p.title+" "+p.body).toLowerCase().includes(q)&&(!f||p.cat===f));$("grid").innerHTML=x.map(p=>`<article class=card><span class=tag>${p.cat}</span><h3>${p.title}</h3><small>${new Date(p.date).toLocaleDateString()}</small><p>${p.body.slice(0,150)}${p.body.length>150?"…":""}</p><div class=actions><button class=btn onclick="openForm(${p.id})">Edit</button><button class="btn danger" onclick="del(${p.id})">Delete</button></div></article>`).join("")||"<div class=panel>No blogs found.</div>"}if(!a.length)a=[{id:1,title:"Welcome to BlogHub",cat:"Technology",body:"This is a sample blog. Edit or delete it and create your own posts.",date:Date.now()}];render();</script>
