<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlogHub Module 5</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f6fb;color:#171927}header{background:#11131f;color:white;padding:18px}.w{max-width:1000px;width:92%;margin:auto}.nav{display:flex;justify-content:space-between;align-items:center}.brand{font-size:24px;font-weight:800}.brand i{color:#9d95ff;font-style:normal}.btn{border:0;border-radius:10px;padding:11px 16px;background:#635bff;color:#fff;font-weight:bold;cursor:pointer}.light{background:white;color:#222;border:1px solid #ddd}.hero{margin:25px 0;padding:38px;border-radius:24px;background:linear-gradient(135deg,#11131f,#332e52);color:#fff}.hero h1{font-size:45px;margin:10px 0}.box{background:#fff;border:1px solid #e3e4eb;border-radius:18px;padding:24px;margin:18px 0}.auth{max-width:500px;margin:25px auto}input{width:100%;padding:13px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px}.layout{display:grid;grid-template-columns:230px 1fr;gap:18px}.side button{display:block;width:100%;margin:8px 0;text-align:left}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid #e3e4eb;border-radius:15px;padding:20px}.stat b{font-size:27px}.hide{display:none}@media(max-width:700px){.layout,.stats{grid-template-columns:1fr}.hero h1{font-size:35px}}</style><header><div class="w nav"><div class="brand">Blog<i>Hub</i> • AUTH</div><button class=btn onclick="logout()">Logout</button></div></header><main class=w><section class=hero><small>MODULE 05 • AUTHENTICATION & DASHBOARD</small><h1>Your private writing space.</h1><p>Login, protected dashboard and user-specific blog management.</p></section><section id=auth class="box auth"><h2 id=heading>Login to BlogHub</h2><form id=af><input id=name class=hide placeholder="Your name"><input id=email type=email placeholder="Email" required><input id=pass type=password placeholder="Password" required><button class=btn>Login</button></form><p id=sw style="color:#635bff;cursor:pointer" onclick=toggle()>New here? Create an account</p></section><section id=dash class=hide><div class=layout><aside class="box side"><h3 id=hello></h3><button class=btn onclick=view('home')>📊 Overview</button><button class="btn light" onclick=view('profile')>👤 Profile</button><button class="btn light" onclick=view('blogs')>📝 My Blogs</button></aside><div id=out></div></div></section></main><script>let users=JSON.parse(localStorage.m5u||"[]"),u=JSON.parse(localStorage.m5s||"null"),reg=false,$=x=>document.getElementById(x);function toggle(){reg=!reg;$("heading").textContent=reg?"Create your account":"Login to BlogHub";$("name").classList.toggle("hide",!reg);$("af button").textContent=reg?"Register":"Login";$("sw").textContent=reg?"Already have an account? Login":"New here? Create an account"}$("af").onsubmit=e=>{e.preventDefault();let email=$("email").value.toLowerCase(),pass=$("pass").value;if(reg){if(!$("name").value)return alert("Enter name");if(users.some(x=>x.email===email))return alert("Email exists");u={id:Date.now(),name:$("name").value,email,pass};users.push(u)}else{u=users.find(x=>x.email===email&&x.pass===pass);if(!u)return alert("Invalid login")}localStorage.m5u=JSON.stringify(users);localStorage.m5s=JSON.stringify(u);start()};function start(){$("auth").classList.add("hide");$("dash").classList.remove("hide");$("hello").textContent="Hi, "+u.name+" 👋";view("home")}function view(v){if(v==="home")$("out").innerHTML=`<div class=stats><div class=stat><small>MY BLOGS</small><br><b>3</b></div><div class=stat><small>ACCOUNT</small><br><b>Active</b></div><div class=stat><small>SECURITY</small><br><b>Protected</b></div></div><div class=box><h2>Dashboard</h2><p>Private dashboard route: only the logged-in user's content is shown here.</p></div>`;else if(v==="profile")$("out").innerHTML=`<div class=box><h2>Profile</h2><p><b>Name:</b> ${u.name}</p><p><b>Email:</b> ${u.email}</p><p><b>Session:</b> Active</p></div>`;else $("out").innerHTML=`<div class=box><h2>My Blogs</h2><p>📝 My latest blog posts are displayed in this private dashboard.</p><article class=box><h3>Building Better Web Experiences</h3><small>Published recently</small><p>My development journey is all about learning by building.</p></article></div>`}function logout(){localStorage.removeItem("m5s");location.reload()}if(u)start()</script>
